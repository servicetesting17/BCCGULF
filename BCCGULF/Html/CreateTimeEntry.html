async function checkHoliday() {
    try {
        const holidayResult = await parent.Xrm.WebApi.retrieveMultipleRecords(
            "bcc_holidays",
            "?$select=bcc_holidaydate,bcc_holidayenddate&$filter=(statecode eq 0)"
        );

        holidayArr = [];

        holidayResult.entities.forEach(record => {
            const startDate = new Date(record.bcc_holidaydate);
            const endDate = new Date(record.bcc_holidayenddate);

            for (let d = new Date(startDate); d < endDate; d.setDate(d.getDate() + 1)) {
                holidayArr.push(d.toLocaleDateString('en-GB'));
            }
        });

    } catch (error) {
        console.error("Error retrieving holiday:", error.message);
    }
}

async function loadTasksDropdown() {
    try {
        const results = await parent.Xrm.WebApi.retrieveMultipleRecords(
            "msdyn_servicetasktype",
            "?$select=msdyn_servicetasktypeid,msdyn_name&$filter=statecode eq 0&$orderby=msdyn_name asc"
        );

        const dropdown = document.getElementById("task");
        dropdown.innerHTML = '<option value="">-- Select Task --</option>';

        results.entities.forEach(task => {
            const option = document.createElement("option");
            option.value = task.msdyn_servicetasktypeid;
            option.text = task.msdyn_name;
            dropdown.appendChild(option);
        });

    } catch (error) {
        console.error("Error retrieving tasks:", error.message);
    }
}

function setDefaultValue() {
    document.getElementById("entryType").value = "100000000";
    document.getElementById("overtime1").value = 2;
    document.getElementById("Duration").value = 8;
    document.getElementById("totalHours").value = 10;

    document.getElementById("overtime2").disabled = true;
    document.getElementById("overtime3").disabled = true;

    document.getElementById("overtime3").value = "";
}

async function loadProjectByResource(resourceGuid) {
    let projectId = "";
    try {
        // Clean the GUID properly
        const cleanGuid = resourceGuid.replace(/[\{\}\[\]]/g, "").trim();
        
        console.log("Loading project for resource:", cleanGuid);
        
        const resource = await parent.Xrm.WebApi.retrieveRecord(
            "bookableresource",
            cleanGuid,
            "?$select=_new_project_value&$expand=new_Project($select=bcc_name,bcc_projectid)"
        );
        
        projectId = resource["_new_project_value"];
        
        console.log("Project ID found:", projectId);
        
        if (!projectId) {
            console.warn("No project assigned to this resource");
            alert("No project is assigned to this resource.");
            return;
        }

        const projectName = resource["_new_project_value@OData.Community.Display.V1.FormattedValue"];
        
        const dropdown = document.getElementById("projectDropdown");
        dropdown.innerHTML = "";
        const option = document.createElement("option");
        option.value = projectId;
        option.textContent = projectName || "Unknown Project";
        dropdown.appendChild(option);
        dropdown.value = projectId;
        dropdown.disabled = true;
        
        console.log("Project loaded successfully:", projectName);
        
        // Load project manager
        const projectmanager = await parent.Xrm.WebApi.retrieveRecord(
            "bcc_project",
            projectId,
            "?$select=_bcc_projectmanager_value"
        );
        approverId = projectmanager["_bcc_projectmanager_value"];
        
        console.log("Approver ID:", approverId);
        
    } catch (error) {
        console.error("❌ Error loading project:", error);
        console.error("Error details:", error.message);
        alert("Failed to load project: " + error.message);
    }
}
function isSystemAdministrator() {
    try {
        const roles = parent.Xrm.Utility.getGlobalContext().userSettings.roles;
        let isAdmin = false;

        roles.forEach(function (role) {
            if (role.name === "System Administrator") {
                isAdmin = true;
            }
        });

        return isAdmin;
    } catch (e) {
        console.error("Role check failed:", e);
        return false;
    }
}

/* --------------------------------------------------------
   DATE CHANGE
-------------------------------------------------------- */
async function onDateChange() {
    const dateInput = document.getElementById("date");
    if (!dateInput.value) return;

    const selectedDate = new Date(dateInput.value);
    const today = new Date();

    today.setHours(0, 0, 0, 0);
    selectedDate.setHours(0, 0, 0, 0);

    const maxDate = new Date(today);
    const minDate = new Date(today);
    minDate.setDate(today.getDate() - 3);

    if (selectedDate > maxDate) {
        alert("You can't select future date!");
        dateInput.value = "";
        return;
    }

    if (!isSystemAdministrator() && selectedDate < minDate) {
        alert("You can't select a date earlier than last 4 days!");
        dateInput.value = "";
        return;
    }

    // ── Previous-day time entry check ────────────────────────────────────────
    const prevDate = new Date(selectedDate);
    prevDate.setDate(selectedDate.getDate() - 1);

    {
        const prevDateStr = [
            prevDate.getFullYear(),
            String(prevDate.getMonth() + 1).padStart(2, "0"),
            String(prevDate.getDate()).padStart(2, "0")
        ].join("-");

        const guids = selectedGuids
            ? selectedGuids.split(",").map(g => g.replace(/[{}]/g, "").trim()).filter(Boolean)
            : [];

        if (guids.length > 0) {
            try {
                const checkRequest = {
                    resourceIds: guids.join(","),
                    checkDate: prevDateStr,
                    getMetadata: function () {
                        return {
                            boundParameter: null,
                            parameterTypes: {
                                resourceIds: { typeName: "Edm.String", structuralProperty: 1 },
                                checkDate:   { typeName: "Edm.String", structuralProperty: 1 }
                            },
                            operationType: 0,
                            operationName: "bcc_CheckMissingTimeEntries"
                        };
                    }
                };

                const checkResponse = await parent.Xrm.WebApi.execute(checkRequest);
                if (checkResponse.ok) {
                    const body = await checkResponse.json();
                    if (body["hasMissing"]) {
                        const missing = JSON.parse(body["missingResourcesJson"] || "[]");
                        showMissingEntriesDialog(missing, prevDateStr);
                        dateInput.value = "";
                        return;
                    }
                }
            } catch (err) {
                console.error("Error checking previous day time entries:", err.message);
            }
        }
    }
    // ── End previous-day check ────────────────────────────────────────────────
    // ─────────────────────────────────────────────────────────────────────

    setDayNameFromDate();

    const formattedDate = selectedDate.toLocaleDateString('en-GB');
    const isHoliday = holidayArr.includes(formattedDate);
    const isSunday = selectedDate.getDay() === 0;

    const overtime1 = document.getElementById("overtime1");
    const overtime2 = document.getElementById("overtime2");
    const overtime3 = document.getElementById("overtime3");
    const durationField = document.getElementById("Duration");
    const entryType = document.getElementById("entryType").value;

    if (entryType === "100000000") {
        if (isSunday || isHoliday) {
            durationField.value = 8;
            overtime3.disabled = false;
            overtime2.value = "";
            overtime2.disabled = true;

            if (isSunday) {
                overtime1.value = 0;
                overtime1.disabled = true;
            } else {
                overtime1.value = "";
                overtime1.disabled = true;
            }
        } else {
            isholiday = false;
            overtime1.value = 2;
            overtime2.value = "";
            overtime3.value = "";
            durationField.value = 8;
            document.getElementById("totalHours").value = 10;
            overtime1.disabled = false;
            overtime2.disabled = true;
            overtime3.disabled = true;
        }
    }

    calculateTotal();
}

function setDayNameFromDate() {
    

    const dateInput = document.getElementById("date");
    const dayInput = document.getElementById("dayName");

    if (!dateInput || !dayInput || !dateInput.value) {
        dayInput.value = "";
        return;
    }

    const parts = dateInput.value.split("-"); // always YYYY-MM-DD
    const selectedDate = new Date(parts[0], parts[1] - 1, parts[2]);

    const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

    dayInput.value = days[selectedDate.getDay()];
}

function getLocalDateString() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
}

        function validateOvertimeFields() {
            const entryType = document.getElementById("entryType").value;
            if (entryType !== "100000000") return true; // Only validate for Present
            
            const overtime1 = parseFloat(document.getElementById("overtime1").value) || 0;
            const overtime2 = parseFloat(document.getElementById("overtime2").value) || 0;
            const overtime3 = parseFloat(document.getElementById("overtime3").value) || 0;
            const totalHours = parseFloat(document.getElementById("totalHours").value) || 0;
            
            let isValid = true;
            let errorMessage = "";
            
            // Validate overtime1 (0-5)
            if (overtime1 < 0 || overtime1 > 5) {
                isValid = false;
                errorMessage = "Overtime 1 must be between 0 and 5 hours";
            }
            
            // Validate overtime2 (0-12)
            if (overtime2 < 0 || overtime2 > 12) {
                isValid = false;
                errorMessage = "Overtime 2 must be between 0 and 12 hours";
            }
            
            // Validate overtime3 (0-16)
            if (overtime3 < 0 || overtime3 > 16) {
                isValid = false;
                errorMessage = "Overtime 3 must be between 0 and 16 hours";
            }
            
            // Validate total hours (0-16)
            if (totalHours < 0 || totalHours > 16) {
                isValid = false;
                errorMessage = "Total hours must be between 0 and 16 hours";
            }
            
            if (!isValid) {
                alert("Validation Error: " + errorMessage);
            }
            
            return isValid;
        }

function validateOvertimeInput(fieldName) {
    const field = document.getElementById(fieldName);
    const value = parseFloat(field.value) || 0;
    const maxValue = fieldName === "overtime1" ? 5 : fieldName === "overtime3" ? 16 : 12;

    if (value < 0 || value > maxValue) {
        field.style.borderColor = "#d13438";
        field.style.backgroundColor = "#fef7f7";
    } else {
        field.style.borderColor = "#ccc";
        field.style.backgroundColor = "";
    }

    // On working days: unlock OT2 and OT3 only when OT1 = 5
    if (fieldName === "overtime1") {
        const isSunday = (function () {
            const d = document.getElementById("date").value;
            if (!d) return false;
            const p = d.split("-");
            return new Date(p[0], p[1] - 1, p[2]).getDay() === 0;
        })();
        const isHoliday = (function () {
            const d = document.getElementById("date").value;
            if (!d) return false;
            const parts = d.split("-");
            const formatted = new Date(parts[0], parts[1] - 1, parts[2]).toLocaleDateString('en-GB');
            return holidayArr.includes(formatted);
        })();

        if (!isSunday && !isHoliday) {
            const ot2 = document.getElementById("overtime2");
            const ot3 = document.getElementById("overtime3");
            if (value >= 5) {
                ot2.disabled = false;
                ot3.disabled = false;
            } else {
                ot2.disabled = true;
                ot2.value = "";
                ot3.disabled = true;
                ot3.value = "";
            }
        }
    }

    calculateTotal();
}

function calculateTotal() {
    let overtime1 = parseFloat(document.getElementById("overtime1").value) || 0;
    let overtime2 = parseFloat(document.getElementById("overtime2").value) || 0;
    let overtime3 = parseFloat(document.getElementById("overtime3").value) || 0;
    let duration = parseFloat(document.getElementById("Duration").value) || 0;
    let total = overtime1 + overtime2 + overtime3 + duration;
    document.getElementById("totalHours").value = total;

    const totalHoursField = document.getElementById("totalHours");
    if (total < 0 || total > 16) {
        totalHoursField.style.borderColor = "#d13438";
        totalHoursField.style.backgroundColor = "#fef7f7";
    } else {
        totalHoursField.style.borderColor = "#ccc";
        totalHoursField.style.backgroundColor = "";
    }

}
async function uploadProjectDocument(projectId, file) {
    if (!file) throw new Error("No file selected");

    const clientUrl = parent.Xrm.Utility.getGlobalContext().getClientUrl();

    // Folder name = Project GUID (cleaned)
    const cleanProjectId = projectId.replace(/[{}]/g, "");

    // 1️⃣ Get or create SharePoint folder + Document Location
    const relativeUrl = await getOrCreateDocumentLocation(
        clientUrl,
        "https://bccgulf.sharepoint.com",
        "/bcc_project",
        "bcc_projects",
        projectId,
        cleanProjectId
    );

    // 2️⃣ Upload file to SharePoint
    await uploadFileToSharePoint(relativeUrl, file);

    return { success: true, message: "File uploaded to SharePoint!" };
}

async function getOrCreateDocumentLocation(clientUrl, siteUrl, library, entityName, projectId, folderName) {

    const query = `${clientUrl}/api/data/v9.2/sharepointdocumentlocations?$filter=_regardingobjectid_value eq ${projectId}`;

    let response = await fetch(query, {
        method: "GET",
        headers: { "Accept": "application/json" }
    });

    let data = await response.json();

    // --------------------------------------------
    // CASE 1: Document Location already exists
    // --------------------------------------------
    if (data.value.length > 0) {
        let rel = data.value[0].relativeurl;

        // FIX: if the library is missing, prepend it
        if (!rel.startsWith(library)) {
            rel = `${library}/${rel}`;
        }

        return rel;
    }

    // --------------------------------------------
    // CASE 2: Create new folder and Document Location
    // --------------------------------------------
    const folderPath = `${library}/${folderName}`;

    // 1️⃣ Create folder in SharePoint
    await createSharePointFolder(siteUrl, folderPath);

    // 2️⃣ Get SharePoint Site ID
    const siteId = await getSharePointSiteId(clientUrl);

    // 3️⃣ Create Document Location record
    const createLocationUrl = `${clientUrl}/api/data/v9.2/sharepointdocumentlocations`;

    const body = {
        name: folderName,
        relativeurl: folderPath,
        "parentsiteorlocation_sharepointsite@odata.bind": `/sharepointsites(${siteId})`,
        [`regardingobjectid_${entityName}@odata.bind`]: `/${entityName}(${projectId})`
    };

    await fetch(createLocationUrl, {
        method: "POST",
        headers: {
            "Accept": "application/json",
            "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
    });

    return folderPath;
}
async function createSharePointFolder(siteUrl, folderRelativeUrl) {

    // Encode each folder part, not the slashes
    const safeFolderPath = folderRelativeUrl
        .split('/')
        .map(encodeURIComponent)
        .join('/');

    const url = `${siteUrl}/_api/web/folders/add('${safeFolderPath}')`;

    // Get digest token
    const digestRequest = await fetch(`${siteUrl}/_api/contextinfo`, {
        method: "POST",
        headers: {
            "Accept": "application/json;odata=verbose"
        }
    });

    const digestData = await digestRequest.json();
    const digest = digestData.d.GetContextWebInformation.FormDigestValue;

    // Now create folder
    const response = await fetch(url, {
        method: "POST",
        headers: {
            "Accept": "application/json;odata=verbose",
            "Content-Type": "application/json;odata=verbose",
            "X-RequestDigest": digest
        }
    });

    // Ignore "folder exists" (409)
    if (!response.ok && response.status !== 409) {
        const errorText = await response.text();
        throw new Error(`Failed to create folder: ${response.status} ${response.statusText}\n${errorText}`);
    }
}


async function getSharePointSiteId(clientUrl) {
    const query = `${clientUrl}/api/data/v9.2/sharepointsites?$select=sharepointsiteid&$top=1`;

    let response = await fetch(query, {
        method: "GET",
        headers: { "Accept": "application/json" }
    });

    let data = await response.json();

    if (data.value.length === 0) {
        throw new Error("No SharePoint site configured in Dynamics!");
    }

    return data.value[0].sharepointsiteid;
}
async function uploadFileToSharePoint(relativeUrl, file) {
    // 1️⃣ Ensure folder exists in SharePoint
    await createSharePointFolder("https://bccgulf.sharepoint.com", relativeUrl);

    // 2️⃣ Encode folder path and file name safely
    const safeFolderPath = relativeUrl.split('/').map(encodeURIComponent).join('/');
    const encodedFileName = encodeURIComponent(file.name);

   
    const uploadUrl = "https://bccgulf.sharepoint.com/_api/web/GetFolderByServerRelativeUrl('${safeFolderPath}')/Files/AddUsingPath(DecodedUrl='${encodedFileName}')";

    console.log("Uploading to:", uploadUrl);

    // 4️⃣ Upload the file
    const response = await fetch(uploadUrl, {
        method: "PUT",
        headers: {
            "Accept": "application/json;odata=verbose",
            "Content-Type": file.type || "application/octet-stream"
        },
        body: file
    });

    if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`SharePoint upload failed: ${response.status} ${response.statusText}\n${errorText}`);
    }

    console.log("File uploaded successfully!");
}
function saveParentFormIfExists() {

        } else {

}


/* Submit entries */
async function submitEntries() {
    try {
        if (clicksubmit) return;
        clicksubmit = true;

        if (!selectedGuids) {
            alert("No record GUIDs found.");
            clicksubmit = false;
            return;
        }

        const dateInput = document.getElementById("date");
        if (!dateInput.value) {
            alert("Please select a date.");
            clicksubmit = false;
            return;
        }

        const entryType1 = document.getElementById("entryType").value;
        if (!entryType1) {
            alert("Please select an entry type.");
            clicksubmit = false;
            return;
        }

        const isAbsent = entryType1 === "100000001";

        if (isAbsent) {
            // ── Absent branch — delegate to custom action ─────────────────────
            const toDateInput = document.getElementById("toDate");
            if (!toDateInput.value) {
                alert("Please select a To Date.");
                clicksubmit = false;
                return;
            }

            const fromDate = dateInput.value;
            const toDate   = toDateInput.value;

            if (toDate < fromDate) {
                alert("To Date cannot be earlier than From Date.");
                clicksubmit = false;
                return;
            }

            const absentReasonEl = document.getElementById("absentReason");
            if (!absentReasonEl.value) {
                alert("Please select an Absent Reason.");
                clicksubmit = false;
                return;
            }

            const absentReason = parseInt(absentReasonEl.value);
            const resourceIds  = selectedGuids
                .split(",")
                .map(g => g.replace(/[{}]/g, "").trim())
                .filter(Boolean)
                .join(",");

            parent.Xrm.Utility.showProgressIndicator("Creating absent time entries...");

            const request = {
                resourceIds:  resourceIds,
                fromDate:     fromDate,
                toDate:       toDate,
                absentReason: absentReason,
                getMetadata: function () {
                    return {
                        boundParameter: null,
                        parameterTypes: {
                            resourceIds:  { typeName: "Edm.String", structuralProperty: 1 },
                            fromDate:     { typeName: "Edm.String", structuralProperty: 1 },
                            toDate:       { typeName: "Edm.String", structuralProperty: 1 },
                            absentReason: { typeName: "Edm.Int32",  structuralProperty: 1 }
                        },
                        operationType: 0,
                        operationName: "bcc_CreateAbsentTimeEntries"
                    };
                }
            };

            const response = await parent.Xrm.WebApi.execute(request);
            parent.Xrm.Utility.closeProgressIndicator();

            if (response.ok) {
                const body = await response.json();
                const resultMsg = body["result"] || "Absent time entries created.";
                alert(resultMsg);
                saveParentFormIfExists();
                clicksubmit = false;
                closePopup();
            } else {
                const errText = await response.text();
                alert("Error creating absent entries: " + errText);
                clicksubmit = false;
            }
            return;
        }

        // ── Present branch (unchanged logic) ─────────────────────────────────
        const taskid = document.getElementById("task").value;
        if (!taskid) {
            alert("Please select a task.");
            clicksubmit = false;
            return;
        }

        const selected = new Date(dateInput.value);
        const selectedDate = new Date(
            selected.getFullYear(),
            selected.getMonth(),
            selected.getDate()
        );

        const today = new Date();
        const maxDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const minDate = new Date();
        minDate.setDate(today.getDate() - 3);

        if (selectedDate > maxDate) {
            alert("You can't select future date!");
            clicksubmit = false;
            return;
        } else if (!isSystemAdministrator() && selectedDate < minDate) {
            alert("You can't select a date earlier than last 4 days!");
            clicksubmit = false;
            return;
        }

        if (!validateOvertimeFields()) {
            clicksubmit = false;
            return;
        }

        parent.Xrm.Utility.showProgressIndicator("Creating time entries...");

        const cleanapproverid = approverId ? approverId.replace(/[{}]/g, "") : "";
        const guids = selectedGuids.split(",");

        const date = dateInput.value;
        const entryTypeValue = parseInt(entryType1);
        const projectguid = document.getElementById("projectDropdown").value.replace(/[{}]/g, "");
        const taskguid = taskid ? taskid.replace(/[{}]/g, "") : "";

        const overtime1 = parseFloat(document.getElementById("overtime1").value) || 0;
        const overtime2 = parseFloat(document.getElementById("overtime2").value) || 0;
        const overtime3 = parseFloat(document.getElementById("overtime3").value) || 0;
        const totalHours = parseFloat(document.getElementById("totalHours").value) || 0;
        const entryStatus = 192350003;

        const fileInput = document.getElementById("fileUpload");
        const file = fileInput?.files?.[0];

        const results = { created: 0, skipped: 0, failed: 0 };

        const promises = guids.map(async guid => {
            try {
                guid = guid.replace(/[{}]/g, "");

                const filter = `?$filter=msdyn_bookableresource/bookableresourceid eq ${guid} and new_date eq ${date}`;
                const existing = await parent.Xrm.WebApi.retrieveMultipleRecords(
                    "msdyn_timeentry",
                    filter
                );

                if (existing.entities.length > 0) {
                    results.skipped++;
                    return;
                }

                const record = {
                    "new_date": date,
                    "bcc_dayofdate": document.getElementById("dayName").value,
                    "new_entrytype": entryTypeValue,
                    "msdyn_entrystatus": entryStatus,
                    "msdyn_bookableresource@odata.bind": `/bookableresources(${guid})`,
                    "bcc_Project@odata.bind": `/bcc_projects(${projectguid})`,
                    "bcc_Approver@odata.bind": `/systemusers(${cleanapproverid})`
                };

                record["bcc_isholiday"] = isholiday;
                record["msdyn_duration"] = 480;
                record["new_overtime1"] = overtime1;
                record["new_overtime2"] = overtime2;
                record["new_overtime3"] = overtime3;
                record["bcc_total_hours"] = totalHours;
                record["new_Task@odata.bind"] = `/msdyn_servicetasktypes(${taskguid})`;

                await parent.Xrm.WebApi.createRecord("msdyn_timeentry", record);
                results.created++;

            } catch (err) {
                console.warn("Create failed:", err.message);
                results.failed++;
            }
        });

        await Promise.allSettled(promises);

        if (file) {
            await CallPowerAutomate(selectedGuids, file, date);
        }

        parent.Xrm.Utility.closeProgressIndicator();

        alert(
            `Time Entry Summary:\n\n` +
            `${results.created} time entry created\n` +
            `${results.failed} failed due to duplicate\n`
        );

        saveParentFormIfExists();
        clicksubmit = false;
        closePopup();

    } catch (e) {
        parent.Xrm.Utility.closeProgressIndicator();
        clicksubmit = false;
        alert("Unexpected Error: " + e.message);
        console.error(e);
    }
}

async function CallPowerAutomate(projectguids, file, date) {

    const base64 = await toBase64(file);   // Convert file

    const payload = {
        projectIds: projectguids.split(","),   // Convert string to array
        date: date,
        file: {
            name: file.name,
            contentBytes: base64
        }
    };

    const response = await fetch("https://af80cd5c7f67e5809e0217bad953e5.46.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/b1bbbcf8b929492689cbb981a1f8f3fa/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=lphkfP4zwXYCF3obTbXPmqDc_30kvWMDn4LtMaGIGsc", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
    });

    if (!response.ok) {
        throw new Error(`Power Automate failed: ${response.status}`);
    }

    console.log("File + Date + Project IDs sent successfully");
}


// Convert file → Base64
function toBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]); // remove data type
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function showMissingEntriesDialog(resources, prevDateStr) {
    document.getElementById("missingEntriesSubtitle").textContent =
        `The following ${resources.length} resource(s) have no time entry for ${prevDateStr}. Please submit their time entries before proceeding.`;

    const tbody = document.getElementById("missingEntriesBody");
    tbody.innerHTML = "";

    resources.forEach((res, i) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${i + 1}</td>
            <td>${res["name"] || "-"}</td>
            <td>${res["bcc_userid"] || "-"}</td>
            <td>${prevDateStr}</td>`;
        tbody.appendChild(tr);
    });

    document.getElementById("missingEntriesModal").classList.add("active");
}

function closeMissingEntriesDialog() {
    document.getElementById("missingEntriesModal").classList.remove("active");
}

function closePopup() {
    try {
        if (typeof parent.Xrm !== "undefined" && parent.Xrm?.Navigation?.close) {
            parent.Xrm.Navigation.close();
        } else {
            window.close();
        }
    } catch (e) {
        console.error("Error closing popup:", e);
        window.close();
    }
}
