<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deactivate Resource</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f2f1;
            padding: 20px;
            margin: 0;
        }

        .form-container {
            background-color: white;
            border: 1px solid #edebe9;
            border-radius: 2px;
            padding: 20px;
            max-width: 900px;
            box-shadow: 0 1.6px 3.6px rgba(0, 0, 0, 0.13);
        }

        h2 {
            margin-top: 0;
            color: #323130;
            font-size: 20px;
            margin-bottom: 20px;
        }

        h3 {
            color: #323130;
            font-size: 16px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        /* Assets Grid Styles */
        .assets-grid {
            margin: 20px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #fafafa;
            max-height: 300px;
            overflow-y: auto;
        }

        .asset-item {
            padding: 14px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .asset-item:last-child {
            border-bottom: none;
        }

        .asset-icon {
            width: 40px;
            height: 40px;
            min-width: 40px;
            background-color: #0078d4;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }

        .asset-details {
            flex: 1;
        }

        .asset-type {
            font-weight: 600;
            color: #323130;
            font-size: 15px;
            margin-bottom: 6px;
        }

        .asset-info {
            font-size: 13px;
            color: #605e5c;
            line-height: 1.6;
        }

        .asset-info-row {
            display: flex;
            gap: 20px;
            margin-bottom: 3px;
        }

        .asset-label {
            font-weight: 600;
            color: #323130;
            min-width: 90px;
        }

        .asset-value {
            color: #605e5c;
        }

        .no-assets {
            padding: 20px;
            text-align: center;
            color: #666;
            font-style: italic;
        }

        /* Toggle Section */
        .toggle-section {
            margin: 20px 0;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 4px;
            border: 1px solid #e1dfdd;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .toggle-label {
            font-weight: 600;
            margin-bottom: 10px;
            color: #323130;
            font-size: 14px;
        }

        .toggle-button {
            position: relative;
            width: 50px;
            height: 26px;
            background-color: #ccc;
            border-radius: 13px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .toggle-button.active {
            background-color: #0078d4;
        }

        .toggle-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-button.active .toggle-slider {
            transform: translateX(24px);
        }

        .toggle-text {
            font-weight: 500;
            color: #323130;
        }

        /* Form Fields */
        .form-field {
            margin-bottom: 20px;
        }

        .field-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #323130;
            margin-bottom: 6px;
        }

        .date-input {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #8a8886;
            border-radius: 2px;
            background-color: white;
            color: #323130;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .date-input:focus {
            outline: none;
            border-color: #0078d4;
            box-shadow: 0 0 0 1px #0078d4;
        }

        .date-input:hover {
            border-color: #323130;
        }

        .remarks-textarea {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #8a8886;
            border-radius: 2px;
            background-color: white;
            color: #323130;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            min-height: 80px;
            resize: vertical;
        }

        .remarks-textarea:focus {
            outline: none;
            border-color: #0078d4;
            box-shadow: 0 0 0 1px #0078d4;
        }

        .remarks-textarea:hover {
            border-color: #323130;
        }

        /* Buttons */
        .button-container {
            margin-top: 24px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .cancel-button {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #323130;
            background-color: #f3f2f1;
            border: 1px solid #8a8886;
            border-radius: 2px;
            cursor: pointer;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.1s ease;
        }

        .cancel-button:hover {
            background-color: #e1dfdd;
        }

        .deactivate-button {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            background-color: #d13438;
            border: 1px solid #d13438;
            border-radius: 2px;
            cursor: pointer;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.1s ease;
        }

        .deactivate-button:hover {
            background-color: #a4262c;
            border-color: #a4262c;
        }

        .deactivate-button:active {
            background-color: #8d191d;
        }

        .deactivate-button:focus {
            outline: 1px solid #323130;
            outline-offset: 2px;
        }

        .deactivate-button:disabled {
            background-color: #f3f2f1;
            border-color: #f3f2f1;
            color: #a19f9d;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Deactivate Resource</h2>
        
        <!-- Related IT Assets Section -->
        <h3>Related IT Assets</h3>
        <div id="assetsGrid" class="assets-grid"></div>

        <!-- Asset Return Confirmation Toggle -->
        <div class="toggle-section">
            <div class="toggle-label">Confirm Asset Return:</div>
            <div class="toggle-container">
                <span class="toggle-text">No</span>
                <div id="toggleButton" class="toggle-button" onclick="toggleConfirmation()">
                    <div class="toggle-slider"></div>
                </div>
                <span class="toggle-text">Yes</span>
            </div>
        </div>

        <!-- Deactivation Date Field -->
        <div class="form-field">
            <label class="field-label" for="dateField">Deactivation Date <span style="color: #d13438;">*</span></label>
            <input type="date" id="dateField" class="date-input">
        </div>

        <!-- Remarks Field -->
        <div class="form-field">
            <label class="field-label" for="remarksField">Remarks</label>
            <textarea id="remarksField" class="remarks-textarea" placeholder="Enter any remarks..."></textarea>
        </div>

        <!-- Attachment Fields -->
        <div class="form-field">
            <label class="field-label" for="attachmentOne">Attachment One</label>
            <input type="file" id="attachmentOne" accept="*/*">
        </div>

        <div class="form-field">
            <label class="field-label" for="attachmentTwo">Attachment Two</label>
            <input type="file" id="attachmentTwo" accept="*/*">
        </div>

        <!-- Buttons -->
        <div class="button-container">
            <button class="cancel-button" onclick="closePopup()">Cancel</button>
            <button class="deactivate-button" id="deactivateBtn" disabled onclick="SetDateAndDeactivate()">
                Deactivate
            </button>
        </div>
    </div>

    <script>
        let selectedGuids = "";
        let recordData = null;
        let isConfirmed = false;

        window.onload = function () {
            try {
                // Get data from parent context
                if (parent && parent.Xrm && parent.Xrm.Utility && parent.Xrm.Utility.getPageContext) {
                    const pageCtx = parent.Xrm.Utility.getPageContext();
                    
                    // Try to get data from web resource data
                    if (pageCtx?.input?.webresourceData?.webresourceData) {
                        const data = pageCtx.input.webresourceData.webresourceData;
                        
                        // Check if it's JSON (new format with assets) or just GUIDs (old format)
                        try {
                            recordData = JSON.parse(data);
                            selectedGuids = recordData.recordId;
                            displayAssets();
                        } catch (e) {
                            // Old format - just GUIDs
                            selectedGuids = data;
                            displayNoAssets();
                        }
                    }
                }
            } catch (e) {
                console.error("Error reading data:", e.message);
            }
        };

        function displayAssets() {
            var assetsGrid = document.getElementById('assetsGrid');
            
            if (!recordData || !recordData.assets || recordData.assets.length === 0) {
                displayNoAssets();
                return;
            }

            var html = '';
            recordData.assets.forEach(function(asset) {
                var icon = asset.assetTypeName.charAt(0).toUpperCase();
                html += '<div class="asset-item">' +
                        '<div class="asset-icon">' + icon + '</div>' +
                        '<div class="asset-details">' +
                        '<div class="asset-type">' + asset.assetTypeName + '</div>' +
                        '<div class="asset-info">' +
                        '<div class="asset-info-row">' +
                        '<span class="asset-label">Asset Name:</span>' +
                        '<span class="asset-value">' + asset.assetName + '</span>' +
                        '</div>' +
                        '<div class="asset-info-row">' +
                        '<span class="asset-label">Model No:</span>' +
                        '<span class="asset-value">' + asset.modelNo + '</span>' +
                        '</div>' +
                        '<div class="asset-info-row">' +
                        '<span class="asset-label">Serial Number:</span>' +
                        '<span class="asset-value">' + asset.serialNumber + '</span>' +
                        '</div>' +
                        '<div class="asset-info-row">' +
                        '<span class="asset-label">Mobile Number:</span>' +
                        '<span class="asset-value">' + asset.mobilenumber + '</span>' +
                        '</div>' +
                        '</div>' +
                        '</div>' +
                        '</div>';
            });
            
            assetsGrid.innerHTML = html;
        }

        function displayNoAssets() {
            var assetsGrid = document.getElementById('assetsGrid');
            assetsGrid.innerHTML = '<div class="no-assets">No IT assets found for this resource.</div>';
        }

        function toggleConfirmation() {
            var toggleButton = document.getElementById('toggleButton');
            var deactivateBtn = document.getElementById('deactivateBtn');
            
            isConfirmed = !isConfirmed;
            
            if (isConfirmed) {
                toggleButton.classList.add('active');
                deactivateBtn.disabled = false;
            } else {
                toggleButton.classList.remove('active');
                deactivateBtn.disabled = true;
            }
        }

        async function SetDateAndDeactivate() {
            if (!isConfirmed) {
                alert("Please confirm asset return before deactivating.");
                return;
            }

            const date = document.getElementById("dateField").value;
            const remarks = document.getElementById("remarksField").value;

            if (!date) {
                alert("Please enter a deactivation date");
                return;
            }

            const file1 = document.getElementById('attachmentOne').files[0];
            const file2 = document.getElementById('attachmentTwo').files[0];

            const guids = selectedGuids.split(",").map(g => g.replace(/[{}]/g, ""));

            try {
                parent.Xrm.Utility.showProgressIndicator("Updating, deactivating and uploading attachments...");

                const updatePromises = guids.map(guid => {
                    const record = {
                        bcc_dateofdeactive: date,
                        statecode: 1,
                        statuscode: 2
                    };

                    if (remarks) {
                        record.bcc_deactivationremark = remarks;
                    }

                    return parent.Xrm.WebApi.updateRecord("bookableresource", guid, record);
                });

                await Promise.all(updatePromises);

                // If any files selected, upload them to the record's File columns
                if (file1 || file2) {
                    for (const guid of guids) {
                        const uploadPromises = [];
                        if (file1) uploadPromises.push(uploadFileColumn(guid, file1, 'bcc_attachmentone'));
                        if (file2) uploadPromises.push(uploadFileColumn(guid, file2, 'bcc_attachmenttwo'));
                        await Promise.all(uploadPromises);
                    }
                }

                parent.Xrm.Utility.closeProgressIndicator();
                alert("✅ Record(s) updated, deactivated and attachments uploaded successfully!");
                closePopup();

            } catch (e) {
                parent.Xrm.Utility.closeProgressIndicator();
                alert("❌ Error: " + e.message);
                console.error(e);
            }
        }

        // Upload a single file to a File column on the record using PUT /<entity>(id)/<fileColumn>/$value
        async function uploadFileColumn(guid, file, attributeLogicalName) {
            try {
                const clientUrl = parent.Xrm.Utility.getGlobalContext().getClientUrl();
                const url = clientUrl + "/api/data/v9.1/bookableresources(" + guid + ")/" + attributeLogicalName + "?x-ms-file-name="+encodeURIComponent(file.name);

                // Use the File object's ArrayBuffer as the request body
                const arrayBuffer = await file.arrayBuffer();

                const resp = await fetch(url, {
                    method: 'PATCH',
                    headers: {
                        'OData-MaxVersion': '4.0',
                        'OData-Version': '4.0',
                        'Accept': 'application/json',
                        'Content-Type': 'application/octet-stream'
                    },
                    body: arrayBuffer,
                });

                if (!resp.ok) {
                    const text = await resp.text();
                    throw new Error('Upload failed: ' + resp.status + ' ' + resp.statusText + ' ' + text);
                }

                return resp;
            } catch (err) {
                console.error('Upload failed for', file.name, err);
                throw err;
            }
        }

        function closePopup() {
            try {
                if (parent && parent.Xrm && parent.Xrm.Navigation) {
                    parent.Xrm.Navigation.closeDialog();
                } else {
                    window.close();
                }
            } catch (e) {
                console.error("Error closing popup:", e);
                window.close();
            }
        }
    </script>
</body>
</html>
